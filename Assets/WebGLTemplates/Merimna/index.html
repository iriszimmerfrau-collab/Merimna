<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23fff' d='M12 21s-8-5.2-8-11a4.6 4.6 0 0 1 8-3 4.6 4.6 0 0 1 8 3c0 5.800-8 11-8 11z'/%3E%3C/svg%3E">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #05030f; }
      #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; background: #05030f; outline: none; }
      #loading {
        position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(ellipse at 50% 40%, #1d1038 0%, #07040f 70%);
        color: #fff; transition: opacity 0.9s ease; z-index: 5;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      #loading .row { display: flex; align-items: center; gap: 22px; }
      #loading h1 {
        margin: 0; font-weight: normal; letter-spacing: 2px; font-size: clamp(56px, 11vw, 150px);
        font-family: 'Bradley Hand', 'Segoe Print', 'Snell Roundhand', 'Marker Felt', 'Comic Sans MS', cursive;
        text-shadow: 0 0 24px rgba(255, 170, 225, 0.55);
      }
      #loading svg { width: clamp(54px, 9vw, 120px); height: auto; animation: bob 2.6s ease-in-out infinite; filter: drop-shadow(0 0 14px rgba(220, 200, 255, 0.8)); }
      #loading .bar { margin-top: 34px; width: min(340px, 60vw); height: 4px; border: 1px solid rgba(255,255,255,0.7); border-radius: 4px; overflow: hidden; }
      #loading .bar > div { width: 0%; height: 100%; background: linear-gradient(90deg, #ffb6e0, #fff); transition: width 0.2s; }
      #loading p { margin: 16px 0 0; font-family: Arial, sans-serif; font-size: 14px; letter-spacing: 3px; opacity: 0.55; animation: pulse 2.4s ease-in-out infinite; }
      @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-12px) rotate(3deg); } }
      @keyframes pulse { 0%, 100% { opacity: 0.25; } 50% { opacity: 0.7; } }
      #error { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 16px; font: 14px Arial, sans-serif; color: #fff; background: rgba(120, 20, 60, 0.9); display: none; z-index: 6; }
    </style>
  </head>
  <body>
    <canvas id="game-canvas" tabindex="-1"></canvas>

    <div id="loading">
      <div class="row">
        <h1>Merimna</h1>
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
          <path fill="#fff" d="M50 88 C 28 74 8 56 8 34 C 8 18 20 8 33 8 C 41 8 47 12 50 19 C 53 12 59 8 67 8 C 80 8 92 18 92 34 C 92 56 72 74 50 88 Z
                               M20 78 q 6 10 12 0 q 6 10 12 0 q 6 10 12 0 q 6 10 12 0 q 6 10 12 0 z"/>
          <ellipse cx="38" cy="38" rx="4.5" ry="6.5" fill="#1a1030"/>
          <ellipse cx="62" cy="38" rx="4.5" ry="6.5" fill="#1a1030"/>
          <ellipse cx="27" cy="50" rx="6" ry="3.5" fill="#ffb6c8" opacity="0.7"/>
          <ellipse cx="73" cy="50" rx="6" ry="3.5" fill="#ffb6c8" opacity="0.7"/>
          <ellipse cx="50" cy="52" rx="3" ry="4" fill="#1a1030"/>
        </svg>
      </div>
      <div class="bar"><div id="progress"></div></div>
      <p>WAKING UP...</p>
    </div>
    <div id="error"></div>

    <script>
      var canvas = document.getElementById("game-canvas");
      var loading = document.getElementById("loading");
      var progress = document.getElementById("progress");
      var errorBox = document.getElementById("error");

      canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      window.addEventListener("keydown", function (e) {
        // keep the page from scrolling / navigating while playing
        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) e.preventDefault();
      }, { passive: false });

      function showError(msg) {
        errorBox.textContent = msg;
        errorBox.style.display = "block";
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
      var config = {
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "{{{ COMPANY_NAME }}}",
        productName: "{{{ PRODUCT_NAME }}}",
        productVersion: "{{{ PRODUCT_VERSION }}}",
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
        showBanner: function (msg, type) { if (type === "error") showError(msg); },
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          progress.style.width = (100 * p) + "%";
        }).then(function () {
          loading.classList.add("done");
          setTimeout(function () { loading.style.display = "none"; }, 1000);
          canvas.focus();
        }).catch(function (message) {
          showError(String(message));
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
